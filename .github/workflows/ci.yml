name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master, 'release/**']

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.16', '1.21', 'stable']
        exclude:
          # Race detector not available on Go 1.16
          - os: ubuntu-latest
            go: '1.16'
          - os: macos-latest
            go: '1.16'
          - os: windows-latest
            go: '1.16'
          # Old-Go binaries lack LC_UUID; the current macos-latest
          # image's dyld aborts them ("missing LC_UUID load command").
          # macOS coverage comes from the 'stable' leg; 1.16/1.21
          # compatibility is covered on ubuntu and windows.
          - os: macos-latest
            go: '1.21'
        include:
          # The race detector runs on this one leg, which is required, so
          # a race blocks a land. The key is set explicitly; the step
          # tests race == true, so a leg without the key never runs it.
          - os: ubuntu-latest
            go: stable
            race: true
          # Test Go 1.16 compatibility without race detector
          # (vet + build only on macos-latest — see LC_UUID note)
          - os: ubuntu-latest
            go: '1.16'
            race: false
          - os: windows-latest
            go: '1.16'
            race: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - run: go vet ./...
      - name: gofmt
        # Formatting is platform-independent; the Windows runner checks out
        # with CRLF, which gofmt would flag on every file.
        if: runner.os != 'Windows'
        shell: bash
        run: |
          unformatted=$(gofmt -l $(git ls-files "*.go"))
          if [ -n "$unformatted" ]; then echo "gofmt needed:"; echo "$unformatted"; exit 1; fi
      - name: Test
        # Every skip is listed, and one hack/skips/allowed.txt does not name
        # fails the job, so a conformance test cannot stop running unnoticed
        # (a port once diverged from a shared vector behind a skipped test).
        # -report: measuring each leg's skips before the list is final.
        shell: bash
        run: |
          status=0; go test -json ./... > test.json || status=$?
          go run ./hack/skips -report -allow hack/skips/allowed.txt < test.json || exit 1
          exit $status
      - name: Test with race detector
        # Runs only where the matrix sets race: true (ubuntu stable). The
        # step used to read `if: matrix.race != false`, which skipped it on
        # every leg: an unset matrix.race is null, and GitHub expressions
        # treat null as equal to false, so the race detector never ran here
        # (found 2026-11-11).
        if: matrix.race == true
        run: go test -race ./...
